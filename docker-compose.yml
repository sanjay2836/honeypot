version: "3.8"

services:
  # -------------------------------------------------------------
  # Backend Threat Intelligence, Analytics & Live Dashboard
  # -------------------------------------------------------------
  honeypot-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: honeypot-backend
    ports:
      - "8000:8000"
    environment:
      # NOTE: the DB must live inside the mounted volume, otherwise it is lost with the container
      - DATABASE_URL=sqlite:////app/data/honeypot.db
      - BACKUP_DIR=/app/data/backups
      - BACKUP_KEEP=10
      - BACKUP_INTERVAL_SECONDS=900
      - INTEGRITY_INTERVAL_SECONDS=300
      # - RECOVERY_API_TOKEN=change-me   # require X-Recovery-Token for backup/restore endpoints
      - PYTHONUNBUFFERED=1
    volumes:
      - honeypot-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/recovery/status', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - honeynet-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # -------------------------------------------------------------
  # SSH Decoy Honeypot (Emulated OpenSSH with Sandboxed Shell)
  # -------------------------------------------------------------
  honeypot-ssh:
    build:
      context: .
      dockerfile: decoys/ssh_decoy/Dockerfile
    container_name: honeypot-ssh
    ports:
      - "2222:22"
    environment:
      - BACKEND_API_URL=http://honeypot-backend:8000/api/events
      - SSH_PORT=22
      - SSH_BANNER=SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
      - SPOOL_DIR=/app/spool
      - PYTHONUNBUFFERED=1
    volumes:
      - ssh-spool:/app/spool      # events buffered while the backend is down survive restarts
    depends_on:
      honeypot-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 22), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - honeynet-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # -------------------------------------------------------------
  # HTTP Decoy Honeypot (Vulnerable Web Portal & Endpoint Traps)
  # -------------------------------------------------------------
  honeypot-http:
    build:
      context: .
      dockerfile: decoys/http_decoy/Dockerfile
    container_name: honeypot-http
    ports:
      - "8080:80"
    environment:
      - BACKEND_API_URL=http://honeypot-backend:8000/api/events
      - HTTP_PORT=80
      - SPOOL_DIR=/app/spool
      - PYTHONUNBUFFERED=1
    volumes:
      - http-spool:/app/spool
    depends_on:
      honeypot-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 80), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - honeynet-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  honeynet-internal:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"

volumes:
  honeypot-data:
  ssh-spool:
  http-spool:
